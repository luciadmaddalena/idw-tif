
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="base.css">
    <title>Veterinaria La Mary</title>

    <script defer src="login.js"></script>
</head>

<body>

    <header>
        <nav class="navegacion">
            <div class="container d-flex justify-content-between align-items-center gap-2">
                <h1 class="h3 mb-0">Veterinaria La Mary</h1>
                <div class="d-flex align-items-center gap-3" >
                    <a href="index.html" class="text-decoration-none">
                    Página principal
                    </a> 
                </div>
            </div>
        </nav>
    </header>
 
    <main>
        
<main>
    <section class="container py-5">
        <div class="row justify-content-center align-items-center">

            <article class="col-12 col-md-7 col-lg-5">

                <form class="d-flex flex-column gap-3 p-4 bg-body-tertiary rounded-4 shadow-sm"
                      id="form-sesion">

                    <h3 class="fs-4 text-center">Iniciar Sesión</h3>

                    <p class="text-secondary text-center">
                        Ingresá tus datos para acceder a Veterinaria La Mary.
                    </p>

                    <div>
                        <label for="nombreUsuario" class="form-label">
                            Nombre de Usuario
                        </label>

                        <input type="text"
                               name="nombreUsuario"
                               id="nombreUsuario"
                               class="form-control"
                               required>
                    </div>

                    <div>
                        <label for="contrasenia" class="form-label">
                            Contraseña
                        </label>

                        <input type="password"
                               name="contrasenia"
                               id="contrasenia"
                               class="form-control"
                               required>
                    </div>

                    <span id="mensajeError" class="text-danger"></span>

                    <button id="botonIniciarSesion"
                            class="btn btn-primary"
                            type="submit">
                        Iniciar Sesión
                    </button>

                </form>

            </article>

        </div>
    </section>
</main>

    </main>

    <footer>
        <div class="footer-marca">
            <span>Veterinaria La Mary</span>
            <p>
                Avenida las Magnolias, 520. Corrientes, Argentina
            </p>
        </div>
    </footer>

</body>
</html>
